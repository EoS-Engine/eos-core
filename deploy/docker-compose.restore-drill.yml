# WP-030-07: isolated restore-drill stack — same three technologies/images/health-check
# conventions as the live docker-compose.yml (never modified by this file), but with distinct
# container names, distinct host ports, and volumes bind-mounted from the isolated drill root
# (never from EOS_DATA_DIR) so the live stack is never touched, stopped, or depended upon.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eos-sqlserver-restore-drill
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DRILL_MSSQL_SA_PASSWORD}
    ports:
      - "14330:1433"
    volumes:
      - ${DRILL_ROOT}/sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: eos-redis-restore-drill
    ports:
      - "16380:6379"
    volumes:
      - ${DRILL_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: eos-chromadb-restore-drill
    ports:
      - "18001:8000"
    volumes:
      - ${DRILL_ROOT}/chroma:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
